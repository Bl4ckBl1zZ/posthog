name: Livestream Docker CI/CD

on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        # Skipped on trunk-merge/** branches: merge-queue PRs are ephemeral, nothing
        # pulls images pushed for them, and each constituent PR already built its own.
        if: github.repository_owner == 'PostHog' && !startsWith(github.head_ref, 'trunk-merge/')

        permissions:
            contents: read
            packages: write
            id-token: write

        outputs:
            sha: ${{ steps.push.outputs.digest }}

        # ECR routing resolved once so the push target can't drift from any reader:
        # master → livestream via the master role; everything else → livestream-prs via the prs role.
        env:
            ECR_IMAGE: ${{ github.ref == 'refs/heads/master' && 'livestream' || 'livestream-prs' }}
            ECR_ROLE: ${{ github.ref == 'refs/heads/master' && vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE || vars.AWS_ECR_POSTHOG_PRS_PUBLISH_IAM_ROLE }}

        steps:
            - name: Assert master publish role is configured
              if: github.ref == 'refs/heads/master'
              env:
                  MASTER_ROLE: ${{ vars.AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE }}
              run: |
                  if [[ -z "$MASTER_ROLE" ]]; then
                    echo "::error::AWS_ECR_POSTHOG_MASTER_PUBLISH_IAM_ROLE is not set — refusing to fall back to the PRS role on master."
                    exit 1
                  fi

            - name: Check out livestream code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  sparse-checkout: |
                      livestream/
                      .github/actions/docker-meta/
                  sparse-checkout-cone-mode: false

            - name: Docker meta and registry login
              id: docker-meta
              uses: ./.github/actions/docker-meta
              with:
                  image-name: livestream
                  # ECR repo + role resolved once at job level (see env above). ghcr/legacy paths unchanged.
                  ecr-image-name: ${{ env.ECR_IMAGE }}
                  aws-role-to-assume: ${{ env.ECR_ROLE }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USER }}
                  dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
                  # We don't push to ghcr.io/posthog/livestream due to that being a legacy repo that we can't delete :/
                  push-to-ghcr: 'false'
                  # Legacy path — remove once Helm charts are updated to ghcr.io/posthog/<image>
                  legacy-images: ghcr.io/posthog/posthog/livestream

            - name: Set up Depot CLI
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: ./livestream/
                  file: livestream/Dockerfile
                  push: ${{ github.event_name == 'pull_request' || vars.CD_DEPLOY_ENABLED == 'true' }}
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.docker-meta.outputs.tags }}
                  labels: ${{ steps.docker-meta.outputs.labels }}
                  annotations: ${{ steps.docker-meta.outputs.annotations }}
    deploy:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: build
        if: github.repository_owner == 'PostHog' && vars.CD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
        steps:
            - name: get deployer token
              id: deployer
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: charts

            - name: Trigger livestream deployment
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ steps.deployer.outputs.token }}
                  repository: PostHog/charts
                  event-type: commit_state_update
                  client-payload: |
                      {
                        "values": {
                          "image": {
                            "sha": "${{ needs.build.outputs.sha }}"
                          }
                        },
                        "release": "livestream",
                        "commit": ${{ toJson(github.event.head_commit) }},
                        "repository": ${{ toJson(github.repository) }},
                        "timestamp": "${{ github.event.head_commit.timestamp }}"
                      }

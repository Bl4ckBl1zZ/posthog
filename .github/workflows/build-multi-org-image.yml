name: Build multi-organization image

on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - 'Dockerfile.multi-org'
            - 'posthog/api/organization.py'
            - 'posthog/utils.py'
            - '.github/workflows/build-multi-org-image.yml'

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
              with:
                  context: .
                  file: Dockerfile.multi-org
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/bl4ckbl1zz/posthog:multi-org-latest
                      ghcr.io/bl4ckbl1zz/posthog:multi-org-${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Verify image boots
              env:
                  IMAGE: ghcr.io/bl4ckbl1zz/posthog:multi-org-${{ github.sha }}
              run: |
                  docker run --rm \
                      -e SKIP_SERVICE_VERSION_REQUIREMENTS=1 \
                      -e STATIC_COLLECTION=1 \
                      -e DATABASE_URL=postgres:/// \
                      -e REDIS_URL=redis:/// \
                      -e INTERNAL_API_SECRET=ci-boot-test-dummy-secret \
                      "$IMAGE" sh -ec 'python -c "import posthog.asgi" && python manage.py check'

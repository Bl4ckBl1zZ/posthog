# The fork's CI overrides are generated from .github/fork-ci-policy.yml, not hand-written.
# This fails a PR that reintroduces a runner or action this fork cannot use, or that drops
# one of the fork changes the policy tracks.
name: Fork CI guard

on:
    push:
        branches:
            - master
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    guard:
        name: Fork CI policy
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.11'

            - run: pip install --quiet pyyaml

            - name: CI policy applied and fork changes intact
              run: python3 bin/fork-ci-normalize.py --check
